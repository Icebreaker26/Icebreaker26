<svg width="100%" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Alejandro Torres — Systems Engineer, Digital Transformation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <g font-family="'Courier New', Consolas, monospace" text-anchor="middle">
    <text x="450" y="98" font-size="44" font-weight="700" fill="#ffffff" opacity="0">
      Alejandro Torres
      <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="450" y="134" font-size="18" fill="#c7d2fe" opacity="0">
      Systems Engineer · Digital Transformation
      <animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.5s" fill="freeze"/>
    </text>
  </g>

  <rect x="0" y="0" width="452" height="200" fill="#020617">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-460 0" begin="0.25s" dur="0.9s" calcMode="spline" keySplines="0.65 0 0.35 1" fill="freeze"/>
  </rect>
  <rect x="448" y="0" width="452" height="200" fill="#020617">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="460 0" begin="0.25s" dur="0.9s" calcMode="spline" keySplines="0.65 0 0.35 1" fill="freeze"/>
  </rect>
</svg>
